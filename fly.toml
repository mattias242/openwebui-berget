app = "openwebui-berget"   # byt till något unikt — kommer bli openwebui-berget.fly.dev
primary_region = "arn"      # Stockholm

[build]
  image = "ghcr.io/open-webui/open-webui:main"

[env]
  OPENAI_API_BASE_URL = "https://api.berget.ai/v1"
  WEBUI_AUTH = "true"
  ENABLE_OLLAMA_API = "false"
  ENABLE_SIGNUP = "false"
  DEFAULT_USER_ROLE = "admin"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[mounts]
  source = "openwebui_data"
  destination = "/app/backend/data"

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
